spring:
  application:
    name: library-management-system
  datasource:
    url: jdbc:postgresql://postgres-db:5432/librarydb
    username: postgres
    password: your_secure_password
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    ignore-migration-patterns:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    mcp:
      server:
        name: library-management-system
        version: 1.0.0
        stdio: false
        sse-endpoint: /mcp/sse
    ollama:
      base-url: http://library-ollama:11434
      chat:
        options:
          model: llama3.1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
