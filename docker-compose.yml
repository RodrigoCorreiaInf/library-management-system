services:
  # 1. PostgreSQL Database with Healthcheck
  postgres-db:
    image: postgres:16-alpine
    container_name: library-postgres
    environment:
      POSTGRES_DB: librarydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d librarydb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Ollama Core Engine
  ollama-service:
    image: ollama/ollama:latest
    container_name: library-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # 3. Model Provisioner (Runs once then exits)
  ollama-model-puller:
    image: curlimages/curl:latest
    container_name: ollama-model-puller
    depends_on:
      - ollama-service
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Ollama to start...';
      while ! curl -s http://ollama-service:11434/api/tags > /dev/null; do sleep 1; done;
      echo 'Ollama is up! Pulling llama3 model...';
      curl -X POST http://ollama-service:11434/api/pull -d '{\"name\": \"llama3\"}';
      echo 'Model pulled successfully!';"

  # 4. Spring Boot Application (Waits for BOTH DB and Model Puller)
  library-app:
    build: .
    container_name: library-app
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy  # Ensures Flyway won't crash on connection refused
      ollama-model-puller:
        condition: service_completed_successfully

volumes:
  pgdata:
  ollama_data: